name: Compilar APK Debug

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Activar caché de dependencias (Gradle y NDK)'
        required: false
        type: boolean
        default: true
      force_fresh_keystore:
        description: 'Obligar a generar firma debug.keystore desde cero'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Compilar APK Debug con C++20 NDK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar licencias e instalar componentes de C++ (CMake y NDK)
        run: |
          # En imágenes ubuntu-latest, el Android SDK está preinstalado en $ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)"
          fi
          echo "Utilizando sdkmanager en: $SDKMANAGER"
          
          # Aceptar todas las licencias del SDK de forma no interactiva
          yes | "$SDKMANAGER" --licenses || true
          
          # Instalar CMake 3.22.1 y el NDK r28c requerido para la compilación de C++20
          echo "Instalando CMake y NDK..."
          "$SDKMANAGER" --install "cmake;3.22.1" "ndk;28.0.12433566"
          
          # Configurar variables de entorno para que Gradle y CMake localicen el NDK
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.12433566" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> $GITHUB_ENV

      - name: Configurar Gradle y Caché Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ !inputs.use_cache }}

      - name: Otorgar permisos de ejecución a scripts y wrappers
        run: |
          chmod +x gradlew
          chmod +x scripts/generate-debug-keystore.sh

      - name: Generar firma de depuración desde cero (debug.keystore)
        run: |
          bash scripts/generate-debug-keystore.sh debug.keystore

      - name: Compilar APK Debug (con binarios nativos C++20 .so)
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK Debug como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
